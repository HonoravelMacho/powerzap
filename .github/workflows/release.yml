name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv2 libgtk-3-0 libgl1 libglib2.0-0 libblkid1 liblzma5 dpkg-dev binutils || \
          sudo apt-get install -y libmpv1 libgtk-3-0 libgl1 libglib2.0-0 libblkid1 liblzma5 dpkg-dev binutils || true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.10.0" pillow

      - name: Gerar ícones
        run: python packaging/gen_icon.py

      - name: Definir versão
        id: ver
        run: |
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.1.0-dev.$(date +%Y%m%d%H%M%S)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Compilar app GUI (flet pack)
        run: |
          rm -rf build dist
          flet pack run.py --name powerzap --icon assets/icon.png --distpath dist
          echo "=== conteúdo de dist/ após flet pack ==="
          ls -R dist || true
          # Normaliza: garante dist/powerzap como arquivo executável
          if [ ! -f dist/powerzap ] && [ -f dist/powerzap/powerzap ]; then
            cp dist/powerzap/powerzap dist/powerzap
          fi
          if [ ! -f dist/powerzap ]; then
            echo "Procurando binário gerado pelo flet..."
            find dist -maxdepth 3 -type f -name "powerzap*" | head -20
          fi
          test -f dist/powerzap || (echo "ERRO: binário dist/powerzap não encontrado" && exit 1)
          chmod +x dist/powerzap
          echo "=== verifica strings novas no binário ==="
          strings dist/powerzap | grep -q "Recarregar lista" && echo "OK: Recarregar lista encontrado" || (echo "FALHA: Recarregar lista NÃO encontrado no binário" && exit 1)
          strings dist/powerzap | grep -q "Diagn" && echo "OK: Diagnostico encontrado" || (echo "FALHA: Diagnostico NÃO encontrado" && exit 1)

      - name: Compilar scheduler
        run: |
          pyinstaller --noconfirm --onefile --name powerzap-scheduler powerzap/scheduler.py
          ls -lh dist/
          test -f dist/powerzap-scheduler || (echo "ERRO: scheduler não gerado" && exit 1)
          chmod +x dist/powerzap-scheduler

      - name: Montar pacote .deb
        run: bash packaging/build_deb.sh "${{ steps.ver.outputs.version }}"

      - name: Gerar .tar.gz portátil
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          STAGE="dist/powerzap-${VERSION}-linux-amd64"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp dist/powerzap dist/powerzap-scheduler "$STAGE/"
          cp README.md "$STAGE/" || true
          cp packaging/powerzap.desktop packaging/powerzap-scheduler.service "$STAGE/" || true
          tar -czf "dist/powerzap-${VERSION}-linux-amd64.tar.gz" -C dist "powerzap-${VERSION}-linux-amd64"
          ls -lh dist/*.tar.gz

      - name: Instalar fpm e gerar .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby rpm
          sudo gem install --no-document fpm
          bash packaging/build_rpm.sh "dist/powerzap_${{ steps.ver.outputs.version }}_amd64.deb" "${{ steps.ver.outputs.version }}"
          ls -lh dist/*.rpm

      - name: Publicar artefatos Linux
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.10.0 pillow

      - name: Gerar ícones
        shell: pwsh
        run: python packaging/gen_icon.py

      - name: Compilar executável Windows (GUI)
        shell: pwsh
        run: |
          flet pack run.py --name PowerZap --icon assets/icon.ico
          Get-ChildItem -Recurse dist | Select-Object FullName, Length | Format-Table -AutoSize
          if (-Not (Test-Path "dist/PowerZap.exe") -And (Test-Path "dist/PowerZap/PowerZap.exe")) {
            Copy-Item "dist/PowerZap/PowerZap.exe" "dist/PowerZap.exe"
          }
          if (-Not (Test-Path "dist/PowerZap.exe")) {
            Write-Error "ERRO: dist/PowerZap.exe não encontrado"
            exit 1
          }

      - name: Compilar scheduler Windows
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onefile --name powerzap-scheduler powerzap/scheduler.py
          Get-ChildItem dist/*.exe

      - name: Publicar artefatos Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-executable
          path: dist/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Listar arquivos da release
        run: ls -lh release-assets/

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
